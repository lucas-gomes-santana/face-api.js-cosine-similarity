<!doctype html>
<html>
  <head>
    <script src="face-api.js"></script>
    <script src="js/commons.js"></script>
    <script src="js/bbt.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.css"
    />
    <script
      type="text/javascript"
      src="https://code.jquery.com/jquery-2.1.1.min.js"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>
  </head>
  <body>
    <div id="navbar"></div>
    <div class="center-content page-container">
      <div>
        <div class="progress" id="loader">
          <div class="indeterminate"></div>
        </div>
        <div class="row side-by-side">
          <div class="center-content">
            <img id="face1" src="" class="margin" />
            <div id="selectList1"></div>
          </div>
          <div class="center-content">
            <img id="face2" src="" class="margin" />
            <div id="selectList2"></div>
          </div>
        </div>
        <div class="row">
          <label for="similarity">Similarity:</label>
          <input disabled value="-" id="similarity" type="text" class="bold" />
        </div>
      </div>
    </div>

    <script>
      // Value in sync with the FaceMatcher default
      const threshold = 0.94;
      let descriptors = { desc1: null, desc2: null };

      function updateResult() {
        const similarity = faceapi.utils.round(
          faceapi.cosineSimilarity(descriptors.desc1, descriptors.desc2),
        );
        let text = similarity;
        let bgColor = "#ffffff";
        if (similarity < threshold) {
          text += " (no match)";
          bgColor = "#ce7575";
        }
        $("#similarity").val(text);
        $("#similarity").css("background-color", bgColor);
      }

      async function onSelectionChanged(which, uri) {
        const input = await faceapi.fetchImage(uri);
        const imgEl = $(`#face${which}`).get(0);
        imgEl.src = input.src;
        descriptors[`desc${which}`] =
          await faceapi.computeFaceDescriptor(input);
      }

      async function run() {
        await faceapi.loadFaceRecognitionModel();
        $("#loader").hide();
        await onSelectionChanged(1, $("#selectList1 select").val());
        await onSelectionChanged(2, $("#selectList2 select").val());
        updateResult();
      }

      $(document).ready(function () {
        renderNavBar("#navbar", "bbt_face_similarity");
        renderFaceImageSelectList(
          "#selectList1",
          async (uri) => {
            await onSelectionChanged(1, uri);
            updateResult();
          },
          { className: "sheldon", imageIdx: 1 },
        );

        renderFaceImageSelectList(
          "#selectList2",
          async (uri) => {
            await onSelectionChanged(2, uri);
            updateResult();
          },
          { className: "howard", imageIdx: 1 },
        );
        run();
      });
    </script>
  </body>
</html>
